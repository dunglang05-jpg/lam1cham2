name: Build Windows App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore LamMotCham.slnx

      - name: Build Release
        run: dotnet build LamMotCham.slnx --configuration Release --no-restore

      - name: Publish standalone Windows x64 executable
        run: dotnet publish src/LamMotCham.App/LamMotCham.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish/win-x64

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: LamMotCham-win-x64
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 14
